name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build typecheck test --filter='!@demystify/services'
      - run: pnpm format:check

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: services/go.sum
      - run: go vet ./...
        working-directory: services
      - run: go build -o bin/ ./cmd/...
        working-directory: services
      - run: go test ./...
        working-directory: services

  images:
    name: Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The images CI builds are the images that ship. Promotion between
      # environments is a tag change, never a rebuild.
      - name: Build services image
        uses: docker/build-push-action@v6
        with:
          context: ./services
          tags: demystify/services:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          tags: demystify/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build migrate image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/goose
          tags: demystify/migrate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  stack:
    name: Stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Bring the stack up
        run: docker compose -f compose.yaml -f compose.ci.yaml up -d --build --wait
      - name: Apply migrations
        run: docker compose --profile tools run --rm migrate up
      - name: Show status
        if: always()
        run: docker compose ps
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
